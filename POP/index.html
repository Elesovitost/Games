<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Populous — prototyp</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="loader" class="loader" aria-live="polite">
    <div class="loader-card">
      <h2>Populous</h2>
      <p>Načítání…</p>
    </div>
  </div>
  <canvas id="c"></canvas>

  <aside id="hud-left" aria-label="Herní panel">
  <nav id="spell-bar" class="spell-bar" role="toolbar" aria-label="Kouzla">
    <div class="spell-group">
      <button type="button" class="spell" data-spell="tree" title="Strom">
        <span class="spell-icon tree" aria-hidden="true"></span>
        <span class="spell-label">STROM</span>
      </button>
      <button type="button" class="spell" data-spell="hypnosis" title="Hypnóza">
        <span class="spell-icon hypnosis" aria-hidden="true"></span>
        <span class="spell-label">HYPNÓZA</span>
      </button>
    </div>
    <div class="spell-group">
      <button type="button" class="spell" data-spell="watcher" title="Hlídač">
        <span class="spell-icon watcher" aria-hidden="true"></span>
        <span class="spell-label">HLÍDAČ</span>
      </button>
      <div class="spell spell-empty" aria-hidden="true"></div>
    </div>
    <div class="spell-group">
      <button type="button" class="spell" data-spell="invisibility" title="Stín">
        <span class="spell-icon invisibility" aria-hidden="true"></span>
        <span class="spell-label">STÍN</span>
      </button>
      <button type="button" class="spell" data-spell="immortality" title="Štít">
        <span class="spell-icon immortality" aria-hidden="true"></span>
        <span class="spell-label">ŠTÍT</span>
      </button>
    </div>
    <div class="spell-group">
      <button type="button" class="spell" data-spell="elevate" title="Elevace">
        <span class="spell-icon elevate" aria-hidden="true"></span>
        <span class="spell-label">ELEVACE</span>
      </button>
      <button type="button" class="spell" data-spell="depress" title="Deprese">
        <span class="spell-icon depress" aria-hidden="true"></span>
        <span class="spell-label">DEPRESE</span>
      </button>
    </div>
    <div class="spell-group">
      <button type="button" class="spell" data-spell="fireball" title="Fireball">
        <span class="spell-icon fireball" aria-hidden="true"></span>
        <span class="spell-label">FIREBALL</span>
      </button>
      <button type="button" class="spell" data-spell="iceball" title="Iceball">
        <span class="spell-icon iceball" aria-hidden="true"></span>
        <span class="spell-label">ICEBALL</span>
      </button>
      <button type="button" class="spell" data-spell="lightning" title="Blesk">
        <span class="spell-icon lightning" aria-hidden="true"></span>
        <span class="spell-label">BLESK</span>
      </button>
      <button type="button" class="spell" data-spell="tornado" title="Tornádo">
        <span class="spell-icon tornado" aria-hidden="true"></span>
        <span class="spell-label">TORNÁDO</span>
      </button>
    </div>
    <div class="spell-group">
      <button type="button" class="spell" data-spell="earthquake" title="Zemětřas">
        <span class="spell-icon earthquake" aria-hidden="true"></span>
        <span class="spell-label">ZEMĚTŘAS</span>
      </button>
      <button type="button" class="spell" data-spell="volcano" title="Sopka">
        <span class="spell-icon volcano" aria-hidden="true"></span>
        <span class="spell-label">SOPKA</span>
      </button>
      <button type="button" class="spell" data-spell="comet" title="Meteor">
        <span class="spell-icon comet" aria-hidden="true"></span>
        <span class="spell-label">METEOR</span>
      </button>
      <button type="button" class="spell" data-spell="demon" title="Démon">
        <span class="spell-icon demon" aria-hidden="true"></span>
        <span class="spell-label">DÉMON</span>
      </button>
    </div>
  </nav>

  <footer id="game-bar" class="game-bar" aria-label="Ovládání">
    <button type="button" id="btn-1p" class="bar-btn active" title="Solo">1P</button>
    <button type="button" id="btn-mp" class="bar-btn" title="Multiplayer (až 4 hráči)">MP</button>
    <button type="button" id="btn-music" class="bar-btn bar-btn-icon" title="Hudba" aria-pressed="true">
      <span class="icon-music" aria-hidden="true">♪</span>
    </button>
    <button type="button" id="btn-color" class="bar-btn bar-btn-icon" title="Barva kouzelníka">
      <span class="icon-dice" aria-hidden="true">🎲</span>
      <span id="color-swatch" class="color-dot" aria-hidden="true"></span>
    </button>
  </footer>

  <div id="health" aria-label="Zdraví">
    <div class="health-row" aria-label="Kouzelník">
      <span class="health-icon heart" aria-hidden="true"></span>
      <div class="health-track">
        <div id="health-fill" class="health-fill"></div>
      </div>
      <button type="button" id="watcher-alarm" class="watcher-alarm hidden" title="Alarm — klikni pro pohled" aria-label="Alarm Hlídače">
        <span class="watcher-alarm-icon" aria-hidden="true"></span>
      </button>
    </div>
    <div id="tree-health" class="health-row tree-health hidden" aria-label="Strom">
      <span class="health-icon tree" aria-hidden="true"></span>
      <div class="health-track">
        <div id="tree-health-fill" class="health-fill tree-fill"></div>
      </div>
    </div>
  </div>
  </aside>

  <aside id="mp-panel" class="mp-panel hidden" aria-label="Multiplayer">
    <button type="button" id="mp-close" class="mp-close" aria-label="Zavřít">×</button>
    <h2>Multiplayer</h2>

    <label class="field">
      <span>Jméno</span>
      <input id="lobby-name" type="text" maxlength="18" autocomplete="nickname" />
    </label>

    <div class="lobby-mode" role="group" aria-label="Typ serveru">
      <button type="button" id="lobby-mode-local" class="mode-btn active" aria-pressed="true">Lokální</button>
      <button type="button" id="lobby-mode-internet" class="mode-btn" aria-pressed="false">Internet</button>
    </div>

    <div class="lobby-actions">
      <button type="button" id="lobby-create">Založit hru (host)</button>
    </div>

    <label class="field" id="lobby-host-field">
      <span>IP hostitele</span>
      <input id="lobby-host" type="text" maxlength="64" placeholder="192.168.1.10" autocomplete="off" />
    </label>
    <label class="field">
      <span>Kód místnosti</span>
      <input id="lobby-join-code" type="text" maxlength="8" placeholder="volitelné" autocomplete="off" />
    </label>
    <div class="lobby-actions">
      <button type="button" id="lobby-join">Připojit se</button>
    </div>

    <div class="lobby-room">
      <div>Místnost: <strong id="lobby-code">—</strong></div>
      <ul id="lobby-roster"></ul>
      <p id="lobby-status" class="lobby-status"></p>
      <button type="button" id="lobby-start" class="hidden" disabled>Spustit hru</button>
      <button type="button" id="lobby-leave" class="ghost">Opustit</button>
    </div>
  </aside>

  <div id="game-version" aria-label="Verze hry"></div>
  <div id="game-over" class="game-over hidden" role="dialog" aria-label="Konec hry">
    <div class="game-over-card">
      <h2>Konec hry</h2>
      <p>Padl jsi dřív, než tvůj strom vyrostl.</p>
      <button type="button" id="game-over-restart">Nová hra</button>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
